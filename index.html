<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout</title>

    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Workout" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- STYLES & SCRIPTS -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <main>
            <section class="workout-selector">
                <div class="button-container">
                    <button id="workoutA" class="workout-btn workout-a">
                        <span class="btn-title">CHEST & TRICEPS</span>
                        <span class="btn-subtitle">1 / 3</span>
                    </button>
                    <button id="workoutB" class="workout-btn workout-b">
                        <span class="btn-title">BACK & BICEPS</span>
                        <span class="btn-subtitle">2 / 3</span>
                    </button>
                    <button id="workoutC" class="workout-btn workout-c">
                        <span class="btn-title">LEGS & SHOULDERS</span>
                        <span class="btn-subtitle">3 / 3</span>
                    </button>
                </div>
            </section>

            <section id="workoutDetails" class="workout-details hidden">
                <div class="workout-header">
                    <button id="backButton" class="back-btn">
                        <img src="Assets/Icons/arrow-back.svg" alt="Return to workout selection">
                    </button>
                    <div class="workout-info">
                        <h2 class="workout-title" id="workoutTitle">TITLE</h2>
                        <span class="workout-focus" id="workoutFocus">1 / 3</span>
                    </div>
                </div>

                <div class="exercises-container" id="exercisesContainer"></div>
            </section>
        </main>
    </div>

    <!-- FAB: add exercise -->
    <button id="addExerciseBtn" class="fab hidden" aria-label="Aggiungi esercizio">+</button>

    <!-- PWA install button -->
    <button id="installButton" class="install-btn hidden">📲 Installa App</button>

    <!-- ADD EXERCISE MODAL -->
    <div id="addExerciseModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-sheet">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Nuovo Esercizio</h3>
                <button class="modal-close" id="modalClose" aria-label="Chiudi">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="newExName">Nome *</label>
                    <input type="text" id="newExName" class="form-input" placeholder="es. Bench Press" autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label" for="newExMuscle">Muscolo *</label>
                    <input type="text" id="newExMuscle" class="form-input" placeholder="es. Chest" autocomplete="off">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="newExSets">Set</label>
                        <input type="text" id="newExSets" class="form-input" placeholder="4">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="newExReps">Reps</label>
                        <input type="text" id="newExReps" class="form-input" placeholder="10">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="newExWeight">Peso</label>
                        <input type="text" id="newExWeight" class="form-input" placeholder="20kg">
                    </div>
                </div>
            </div>
            <button id="saveNewExercise" class="modal-save-btn">Aggiungi</button>
        </div>
    </div>

    <!-- EXERCISE CARD TEMPLATE -->
    <template id="exerciseTemplate">
        <div class="exercise-card">
            <div class="drag-handle" aria-label="Trascina per riordinare">⠿</div>
            <div class="exercise-main">
                <div class="exercise-header">
                    <h3 class="exercise-name">Exercise Name</h3>
                    <div class="exercise-muscle">Target Muscle</div>
                    <button class="delete-btn" aria-label="Elimina esercizio">×</button>
                </div>
                <div class="exercise-inputs">
                    <div class="input-group">
                        <label class="input-label">Sets</label>
                        <input type="text" class="input-field sets-input" value="3">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Reps</label>
                        <input type="text" class="input-field reps-input" value="10-12">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Weight</label>
                        <input type="text" class="input-field weight-input" value="0 kg">
                    </div>
                </div>
            </div>
        </div>
    </template>
</body>

</html>
